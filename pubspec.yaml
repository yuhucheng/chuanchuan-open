name: share_hub_open
description: Share Hub open client foundation and platform adapters.
publish_to: none
version: 0.1.0-dev.1+1

environment:
  sdk: '>=3.13.2 <4.0.0'
  flutter: '>=3.47.2'

dependencies:
  share_hub_file_transfer:
    path: packages/share_hub_file_transfer
  share_hub_connection:
    path: packages/share_hub_connection
  share_hub_media_sdk:
    path: .local/media-sdk/package
  flutter:
    sdk: flutter
  crypto: 3.0.6
  share_hub_media_api:
    path: packages/share_hub_media_api

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

dependency_overrides:
  share_hub_media_api:
    path: packages/share_hub_media_api

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
