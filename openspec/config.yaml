schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  本仓是 chuanchuan-open，维护唯一产品客户端、Windows/macOS 平台宿主和公开 share_hub_media_api 契约。
  先读 AGENTS.md、docs/development/branch-management.md、docs/version-plan.md、docs/development/openspec.md 和 openspec/README.md。
  只用既有 main，不自行创建分支/worktree。VERSION=0.1.0 是产品基线，不是所有规划的发布日期。
  客户端和贡献者构建统一要求 SDK；没有无 SDK 模式。SDK 实现不属于本仓，不依赖客户端 UI。
  当前标准 SDK 目录为 .local/media-sdk/package；正式二进制 SDK 尚未交付，不虚构下载链接。
  specs 是现有能力/约束基线；未实现设计进入 changes。公开 API 版本与产品/规格版本独立维护。
  规格版本在 spec.md 前言和 catalog.json 中一致维护；未排期功能用 release-target unassigned。
  公共文档必须能够独立阅读，不依赖私有仓库文件；不复制 SDK 实现、生产实例信息或运营凭据。
  本地 CLI 使用 npm exec -- openspec，先 npm ci 安装锁定版本。校验使用 npm run spec:validate。
  本次导入的 planned changes 只整理既有设计，不恢复此前停止的产品功能开发。

rules:
  proposal:
    - 写清能力ID、规格版本、产品基线、目标版本、来源和SDK契约影响；未决建议不得提升为确认需求。
    - 对当前没有定义的远端会话契约先提案，不把 PreviewEngine 当作完整投屏/远控 API。
  specs:
    - 每项 Requirement 含 MUST 或 SHALL，至少一个 WHEN/THEN Scenario；补充取消、失败及授权边界。
    - 保留 spec-id/spec-version/product-baseline/release-target/lifecycle/delivery 前言并更新 catalog.json。
    - 明确 Verification 与 Sources；Windows 真实首帧、Mac 新插件布局需独立实机验收。
  design:
    - 区分用户决定、已实现行为和候选方案；只引用公开代码、文档与测试，不复制私有实现。
  tasks:
    - 拆成可验证的任务，列出具体命令与平台；未执行任务不得勾选。
    - 不自动创建分支、提升功能排期或启动未授权的产品实现。

operations:
  apply:
    guidance:
      - 按当前用户授权范围执行；planned 不表示所有产品功能已获实施授权。
      - 遵守 main、版本化提交和已安装的Git钩子；契约变更与SDK兼容性协同验证。
  archive:
    guidance:
      - 先核对任务和验收证据，不能为清空待办而归档未实现变更。
      - 同步后检查基线前言、规格版本、catalog、索引与 Sources；OpenSpec 不自动维护本项目版本元数据。

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
